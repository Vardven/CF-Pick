name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 生成「自上个正式版以来的改动」需要完整 tag 历史

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip "pyinstaller==6.22.3" pywebview

      - name: Build icon
        run: python gen_icon.py

      - name: Show PyInstaller version
        run: python -m PyInstaller --version

      - name: Build exe
        shell: bash
        run: |
          if python -c "import tkinter" 2>/dev/null; then
            SPLASH="--splash splash.png"; echo "splash: on"
          else
            SPLASH=""; echo "splash: skipped (tkinter not available)"
          fi
          python -m PyInstaller --noconfirm --clean --onefile --noconsole \
            --name CF-Pick --icon icon.ico $SPLASH \
            --collect-all webview \
            --hidden-import webview.platforms.winforms --hidden-import clr \
            --add-data "ui.html;." --add-data "cf-domains.txt;." --add-data "cf-asn.txt;." cfpick.py

      - name: Smoke test
        shell: pwsh
        env:
          CF_PICK_NO_BROWSER: "1"
        run: |
          $ErrorActionPreference = "Continue"
          $exe = (Resolve-Path "dist\CF-Pick.exe").Path
          $work = (Resolve-Path "dist").Path
          Write-Host "exe: $exe"
          $p = Start-Process -FilePath $exe -WorkingDirectory $work -PassThru
          Write-Host "pid: $($p.Id)"

          $hit = 0
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and $hit -eq 0) {
            Start-Sleep -Seconds 2
            foreach ($port in 5390..5405) {
              try {
                $c = New-Object System.Net.Sockets.TcpClient
                $c.Connect("127.0.0.1", $port)
                if ($c.Connected) {
                  $c.Close()
                  $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/api/ping" -UseBasicParsing -TimeoutSec 5
                  if ($r.Content -match "ok") { $hit = $port; break }
                }
                $c.Dispose()
              } catch { }
            }
            if ($hit -eq 0) { Write-Host "waiting... alive=$($p.HasExited -eq $false)" }
          }

          if ($hit -eq 0) {
            Write-Host "=== diagnostics ==="
            Get-Process CF-Pick -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,StartTime | Out-String | Write-Host
            foreach ($f in @("$work\CF-Pick.log", "$env:LOCALAPPDATA\CF-Pick\CF-Pick.log")) {
              if (Test-Path $f) { Write-Host "--- $f ---"; Get-Content $f -Tail 40 | Write-Host }
            }
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalPort -ge 5380 -and $_.LocalPort -le 5410 } |
              Format-Table LocalAddress,LocalPort,OwningProcess | Out-String | Write-Host
            Get-Process CF-Pick -ErrorAction SilentlyContinue | Stop-Process -Force
            throw "smoke test failed: no port responded"
          }

          Write-Host "alive on $hit"
          Invoke-WebRequest -Uri "http://127.0.0.1:$hit/api/shutdown" -UseBasicParsing -TimeoutSec 5 | Out-Null
          Start-Sleep -Seconds 2
          Get-Process CF-Pick -ErrorAction SilentlyContinue | Stop-Process -Force
          Write-Host "smoke test passed"

      - name: Changelog for rolling prerelease
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre'))
        shell: bash
        run: |
          BASE=$(git tag --list 'v*' --sort=-v:refname | grep -Ev -- '-' | grep -vx -- "${GITHUB_REF_NAME}" | head -1)
          if [ -z "$BASE" ]; then BASE=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          {
            echo "**滚动预发布**：同一个 release 会被后续改动反复覆盖，永远放最新的测试包，不再一个改动占一条。"
            echo ""
            echo "- 构建时间：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 提交：\`${GITHUB_SHA:0:7}\`"
            echo "- 基线（上个正式版）：\`${BASE}\`"
            echo ""
            echo "**自 ${BASE} 以来的改动**"
            echo ""
            git log --no-merges --pretty='- %s（%h）' "${BASE}..HEAD"
          } > release-body.md
          cat release-body.md

      - name: Release (stable)
        if: startsWith(github.ref, 'refs/tags/') && !(contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CF-Pick.exe
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Release (rolling prerelease)
        if: startsWith(github.ref, 'refs/tags/') && (contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-pre'))
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CF-Pick.exe
          name: "预发布（滚动更新）· ${{ github.ref_name }}"
          body_path: release-body.md
          draft: false
          prerelease: true
